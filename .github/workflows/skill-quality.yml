name: Skill quality

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The gate's default diff base is HEAD~1; the default shallow
          # checkout (depth 1) has no parent commit, so skill:check exits 4.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run skill:check
      - run: npm run skill:verify
      - run: npm run build
      - run: npm run coverage
      - run: npm audit --audit-level=high
      - run: npm run test:e2e
