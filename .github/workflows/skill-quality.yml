name: Skill quality

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run skill:check
      - run: npm run skill:verify
      - run: npm run build
