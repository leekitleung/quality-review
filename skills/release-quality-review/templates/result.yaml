# Result YAML Template
# Each reviewer MUST output exactly these 11 top-level fields.

reviewer: <reviewer-name>
profile: <quick|default|release-gate|full|agentic-release-gate>
round: <positive-round-number>
candidate_commit: <40-character-git-commit-sha>
candidate_tree: <40-character-git-tree-sha>
score: <0-100-integer>
status: pass|fail
review_backend: <claude|codex>
review_model: <backend-compatible-model-name>
blockers: []
redlines: []

# Put dimensions, evidence, recommendations, notes, and fix details in score.md,
# blockers.md, or improvement-list.md. They are not result.yaml top-level fields.
