## Integration with Profiles

### strict mode (release-gate)

```yaml
strict:
  require_delivery_packet: true
  missing_packet_verdict: FAIL
  forensic_only_for_contradiction: true
  min_required_score: 90
```

### assisted mode (default)

```yaml
assisted:
  require_delivery_packet: true
  missing_packet_verdict: INCOMPLETE
  forensic_allowed: true
  min_required_score: 85
```

### legacy mode (fallback)

```yaml
legacy:
  require_delivery_packet: false
  missing_packet_verdict: CONDITIONAL_PASS
  forensic_allowed: true
  max_verdict: CONDITIONAL_PASS
  requires_manual_review: true
```
