# Completion Integrity Rubric (完成度完整性标准)

## Purpose

定义什么是"真正的完成"，区分真完成和伪完成。

## Core Definition

### 真完成 (True Completion)

满足以下所有条件：
1. **目标达成**: 原始目标中描述的状态已达到
2. **证据充分**: 有可验证的证据证明目标达成
3. **边界清晰**: 明确知道什么在范围内、什么不在
4. **风险已知**: 潜在风险已被识别和评估
5. **可回滚**: 有回滚方案应对问题

### 伪完成 (Pseudo Completion)

满足以下任一条件即为伪完成：
1. 修复了 happy path 但未处理异常路径
2. 声称完成但无任何可验证证据
3. 只测试了"改了什么"，未测试"可能影响什么"
4. 改了功能但未更新文档
5. 引入了新风险但未声明
6. 交付范围与目标严重偏离

## Scoring Dimensions

### 1. Goal Achievement (30%)

**检查项**:
- [ ] 目标状态是否达成
- [ ] 是否有可量化的完成标准
- [ ] 完成标准是否被验证

**证据要求**:
- 必须有目标状态的实际证据
- 证据必须可独立验证

### 2. Evidence Sufficiency (25%)

**检查项**:
- [ ] 构建证据存在且通过
- [ ] 测试证据存在且通过
- [ ] 类型检查证据存在且通过
- [ ] 关键路径有覆盖

**证据要求**:
- L2+ 级别证据（命令+输出）
- 证据时间戳与评审时间一致

### 3. Boundary Clarity (15%)

**检查项**:
- [ ] 明确标注了未完成项
- [ ] 明确标注了 TBD/WIP 部分
- [ ] 无目标外变更或已说明

### 4. Risk Acknowledgment (15%)

**检查项**:
- [ ] 识别了潜在风险
- [ ] 评估了风险影响
- [ ] 有缓解措施或回滚方案

**高风险必须声明**:
- 破坏性变更
- 新依赖引入
- API 契约变更
- 安全相关变更

### 5. Reversibility (15%)

**检查项**:
- [ ] 有备份方案
- [ ] 变更可被追踪
- [ ] 回滚步骤已记录

## Red Lines

```yaml
immediate_fail:
  - 无任何证据支撑的声明
  - 删除现有测试
  - 引入未扫描的安全漏洞
  - 破坏 API 契约兼容性
```

## Score Interpretation

| Score | Interpretation | Action |
|-------|---------------|--------|
| 90-100 | 真完成 | 可以发布 |
| 85-89 | 基本完成，有小瑕疵 | 补充证据后可发布 |
| 70-84 | 伪完成迹象 | 需要补充或重构 |
| < 70 | 伪完成 | 打回重做 |
